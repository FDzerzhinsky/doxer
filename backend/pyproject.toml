[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Document Assistant RAG system"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "numpy>=1.26",
  "faiss-cpu>=1.10.0",
]

[project.scripts]
inspect-ingestion = "app.scripts.inspect_ingestion:main"
ask-document = "app.scripts.ask_document:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "unit: fast tests for isolated functions and classes",
  "integration: service and API boundary tests",
  "smoke: minimal health and boot verification",
]
